[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "babelcraft"
version = "0.1.0"
description = "Convierte mods de Minecraft Java Edition a addons nativos de Bedrock Edition (.mcaddon)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "The BabelCraft Authors" }]
keywords = ["minecraft", "bedrock", "java", "mod", "converter", "mcaddon", "geckolib"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
babelcraft = "babelcraft.cli:main"

[project.urls]
Homepage = "https://github.com/babelcraft/babelcraft"

[tool.setuptools]
packages = ["babelcraft", "babelcraft.converters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
